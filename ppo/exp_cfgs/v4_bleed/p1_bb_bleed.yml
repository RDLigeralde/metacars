world:
  seed: 42
  map: /home/roberto/indep/agent2d/agent/tracks # either single map or dir to be sampled from in domain randomization
  num_agents: 1
  num_envs:
    count: 21 # set -1 to use number of cpu cores
    type: subproc # subproc or dummy
  num_obstacles: 0 # spawns obstacles in range [0, num_obstacles]
  num_beams: 540 # number of lidar beams
  timestep: 0.01
  observation_config: 
    type: lidar_conv # need the nested dict for the observation config
  reset_config:
    type: rl_random_static
  control_input: ['speed', 'steering_angle']
  normalize_input: true
  render_mode: null # set null to disable rendering: only for single env eval / debugging
  n_steps: 2 # can reasonably expect ~50hz on Jetson
  n_cline_points: 25
  cline_norm_x: 20
  cline_norm_y: 20

car:
  # dr_param_ex:
  #  min: x
  #  max: y
  mu: 1.0
  C_Sf: 4.718
  C_Sr: 5.4562
  width: 0.31
  length: 0.58
  m: 3.74
  I: 0.04712
  h: 0.074
  v_min: -4.0
  v_max: 8.0
  a_max: 9.51
  s_min: -0.4189
  s_max: 0.4189
  v_switch: 7.319
  sv_min: -3.2
  sv_max: 3.2

reward_params:
  refline_type: centerline  # raceline or centerline
  vel_action_change_penalty: -0.05  # -0.5
  steer_action_change_penalty: -0.1  # -1.0
  stagnation_penalty: 0.0
  stagnation_cutoff: 0.0  # delta s as a fraction of total track length
  velocity_reward_scale: 0.0
  heading_penalty: -1.0
  progress_weight: 0
  crash_curriculum: 100000  # int(1e5)
  delta_u_curriculum: 1000000  # int(1e6)
  v_ref_curriculum: 1000000  # int(1e6)
  milestone_reward: 5
  decay_interval: 100000  # 1e5
  max_crash_penalty: 10
  turn_speed_penalty: 0  # -0.1
  initial_crash_penalty: -1.0
  milestone_increment: 0.01 # how much to downsample the cline points for milestone checking
  overtake_reward: 0.0
  existence_penalty: -0.1

ppo_params:
  feature_extractor:
    type: LidarOdomBlender # null for default or name of BaseFeaturesExtractor subclass
    args: # args for provided feature extractor
      num_odom_layers: 1
      num_cline_layers: 1
  init_path: null # if resuming a run
  recurrent: False
  device: cuda
  learning_rate: 0.0001
  n_steps: 8192
  batch_size: 8192
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: False
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1

train_params:
  total_timesteps: 5_000_000
  save_interval: 100_000
  log_interval: 1
  reset_num_timesteps: False
  progress_bar: False

log:
  log_tensorboard: True
  project_name: null # set null to disable wandb
  run_name: reward_svsdoublesmooth_odom_b2048